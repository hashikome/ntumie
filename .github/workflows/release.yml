name: Release ntumie.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote to the prepared production Dokploy Stacks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ntumie-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  image-check:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: docker build -f apps/api/Dockerfile -t release-check .
      - run: docker build -f apps/web/Dockerfile -t web-release-check .
      - run: bun run verify:release-image -- release-check web-release-check
  image:
    needs: image-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.inputs.outputs.api }}
      web: ${{ steps.inputs.outputs.web }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "api=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.api }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.web }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable release inputs
        id: inputs
        env:
          API_IMAGE: ${{ steps.name.outputs.api }}:${{ github.sha }}@${{ steps.build.outputs.digest }}
          WEB_IMAGE: ${{ steps.name.outputs.web }}:${{ github.sha }}@${{ steps.web.outputs.digest }}
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nRELEASE_SHA=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" > release-inputs.txt
          cat release-inputs.txt >> "$GITHUB_STEP_SUMMARY"
          printf 'api=%s\nweb=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ntumie-release-inputs
          path: release-inputs.txt
          retention-days: 90
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Create missing Docker secrets
        uses: hashikome/actions/docker-secrets@66a6e8f29d643f53b7f3c8b52df175b8eb7971db # v1.1.0
        with:
          # Only the secrets deploy/docker-secrets.json names: never the whole `secrets` context.
          values: >-
            {"DATABASE_URL": ${{ toJSON(secrets.DATABASE_URL) }},
            "MIGRATION_DATABASE_URL": ${{ toJSON(secrets.MIGRATION_DATABASE_URL) }},
            "REDIS_URL": ${{ toJSON(secrets.REDIS_URL) }},
            "BETTER_AUTH_SECRET": ${{ toJSON(secrets.BETTER_AUTH_SECRET) }},
            "EMAIL_SUPPRESSION_SECRET": ${{ toJSON(secrets.EMAIL_SUPPRESSION_SECRET) }},
            "WEB_SOURCE_SECRET": ${{ toJSON(secrets.WEB_SOURCE_SECRET) }},
            "GOOGLE_CLIENT_ID": ${{ toJSON(secrets.GOOGLE_CLIENT_ID) }},
            "GOOGLE_CLIENT_SECRET": ${{ toJSON(secrets.GOOGLE_CLIENT_SECRET) }},
            "RESEND_API_KEY": ${{ toJSON(secrets.RESEND_API_KEY) }},
            "SENTRY_DSN": ${{ toJSON(secrets.SENTRY_DSN) }}}
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          ssh-target: ${{ vars.SERVER_SSH_TARGET }}
          ssh-host-key: ${{ vars.SERVER_HOST_KEY }}
      - name: Migrate, verify grants, then promote application images
        uses: hashikome/actions/dokploy-release@66a6e8f29d643f53b7f3c8b52df175b8eb7971db # v1.1.0
        with:
          images: |
            API_IMAGE=${{ needs.image.outputs.api }}
            WEB_IMAGE=${{ needs.image.outputs.web }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          registry-id: ${{ vars.DOKPLOY_REGISTRY_ID }}
          github-token: ${{ github.token }}
