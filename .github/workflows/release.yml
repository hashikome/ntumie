name: Release ntumie.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Record a release for the deploy agent to apply
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ntumie-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  image-check:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: docker build -f apps/api/Dockerfile -t release-check .
      - run: docker build -f apps/web/Dockerfile -t web-release-check .
      - run: bun run verify:release-image -- release-check web-release-check
  image:
    needs: image-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.inputs.outputs.api }}
      web: ${{ steps.inputs.outputs.web }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "api=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${REPOSITORY,,}/web" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.api }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.web }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable release inputs
        id: inputs
        env:
          API_IMAGE: ${{ steps.name.outputs.api }}:${{ github.sha }}@${{ steps.build.outputs.digest }}
          WEB_IMAGE: ${{ steps.name.outputs.web }}:${{ github.sha }}@${{ steps.web.outputs.digest }}
        run: |
          printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nRELEASE_SHA=%s\n' "$API_IMAGE" "$WEB_IMAGE" "$GITHUB_SHA" > release-inputs.txt
          cat release-inputs.txt >> "$GITHUB_STEP_SUMMARY"
          printf 'api=%s\nweb=%s\n' "$API_IMAGE" "$WEB_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ntumie-release-inputs
          path: release-inputs.txt
          retention-days: 90
  release:
    # Nothing here can deploy: this job records the release, and the deploy agent on hs (infra,
    # retire-Dokploy M3) migrates, then applies the latest release; its verdict goes to Kuma.
    # Rolling back is marking an earlier release as latest (`gh release edit <tag> --latest`).
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hashikome/actions/github-release@a467efcf2cd3a8568642844a58bc65b376d5e156
        with:
          images: |
            API_IMAGE=${{ needs.image.outputs.api }}
            WEB_IMAGE=${{ needs.image.outputs.web }}
          github-token: ${{ github.token }}

  prune-images:
    # GHCR keeps the newest 3 tagged images of each package, with their attestations, once the
    # release is live (workspace service-naming.md, "Images"). Its own job, so package deletion never
    # shares a runner with production secrets. Gives way to a desired-state-aware cleanup by the agent.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: ntumie/api,ntumie/web
          keep-n-tagged: 3
          delete-untagged: true
          validate: true
